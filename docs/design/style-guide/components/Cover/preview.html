<title>Hexrota</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--cream); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .plum { fill:var(--panel); }
  .green { fill:var(--cta); }
  .gold { fill:var(--gold); }
  .sky { fill:var(--world-sky); }
  .red { fill:var(--heart); }
  .blk { rx:var(--radius-l); }
  .blk-m { rx:var(--radius-m); }
  .pill { rx:var(--radius-s); }
  .hex { fill:var(--gold); }
  .hex.cut { fill:var(--gold-light); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:104px; line-height:.92; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; font-weight:800; color:var(--ink-muted); }
</style>
</head>
