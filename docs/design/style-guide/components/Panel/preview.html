<!doctype html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Panel</title></head><body>
<div class="hx-stage" style="padding:44px 16px 40px">
  <div class="hx-panel">
    <div class="hx-ribbon">Kümesi Büyüt</div>
    <div class="hx-close">×</div>
    <div class="hx-card" style="text-align:center">
      <div class="display-m">Seviye 2 → 3</div>
      <p class="body hx-muted" style="margin:6px 0 0">Yeni tünek: 2 tavuk daha yerleşebilir.</p>
    </div>
    <div class="hx-well" style="margin-top:12px;display:flex;justify-content:space-around;text-align:center">
      <div><div class="display-s">+2</div><div class="caption" style="color:var(--on-panel-muted)">Tavuk yeri</div></div>
      <div><div class="display-s">+10%</div><div class="caption" style="color:var(--on-panel-muted)">Günlük altın</div></div>
    </div>
    <div style="display:flex;justify-content:center;margin-top:20px">
      <button class="hx-btn buy" style="min-width:220px"><span>12 Yumurta</span></button>
    </div>
  </div>
</div></body></html>
