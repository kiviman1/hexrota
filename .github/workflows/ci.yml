name: Hexrota CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Tests only need to read repository contents.
permissions:
  contents: read

concurrency:
  group: hexrota-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay-tests:
    name: Gameplay, UI and data tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test gameplay, variants, lives, UI and data consistency
        run: npm test

  csharp-reward-parity:
    name: C# reward parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare JavaScript reward outputs
        run: npm run test:unity-rewards

  csharp-gameplay-parity:
    name: C# gameplay parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare every gameplay wave and save
        run: npm run test:unity-gameplay

  browser-session-consistency:
    name: Chromium life and save consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real two-tab locks, atomic save recovery and verified ad rewards
        run: npm run test:session-browser
      - name: Test combined mobile, canonical saves, observations and offline shell
        run: npm run test:integration-browser

  mobile-input-browser:
    name: Mobile input in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test actual SVG geometry and pointer input
        run: npm run test:mobile-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
      - name: Verify the first opening, slow demonstration and earned tutorial progress
        run: npm run test:first-play
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_FIRST_PLAY_SCREENSHOT_DIR: test-results/first-play-${{ matrix.browser }}
      - name: Verify the earned welcome chest and complete developer reset
        run: npm run test:welcome-reset-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_WELCOME_SCREENSHOT_DIR: test-results/welcome-reset-${{ matrix.browser }}
      - name: Verify the emerging Gold stays in front and the halo visibly rotates
        run: npm run test:welcome-visual
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_WELCOME_VISUAL_SCREENSHOT_DIR: test-results/welcome-visual-${{ matrix.browser }}
      - name: Keep welcome coin layering and halo pixel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: welcome-visual-${{ matrix.browser }}
          path: test-results/welcome-visual-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Keep welcome reward and reset screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: welcome-reset-${{ matrix.browser }}
          path: test-results/welcome-reset-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Keep first-opening screenshots and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: first-play-${{ matrix.browser }}
          path: test-results/first-play-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Verify both swap stones with actual screenshot pixels
        run: npm run test:swap-visual
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_SWAP_SCREENSHOT_DIR: test-results/swap-${{ matrix.browser }}
      - name: Verify one-clear rewards and mobile economy screens
        run: npm run test:economy-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_ECONOMY_SCREENSHOT_DIR: test-results/economy-${{ matrix.browser }}
      - name: Verify permanent botanical progression and read-only mobile garden
        run: npm run test:garden-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_GARDEN_SCREENSHOT_DIR: test-results/garden-${{ matrix.browser }}
      - name: Verify Comic Adventure theme and responsive components
        run: npm run test:comic-ui-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_COMIC_SCREENSHOT_DIR: test-results/comic-${{ matrix.browser }}
      - name: Verify Tavik scene, canonical construction, fixed board geometry and real offline reload
        run: npm run test:scene-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_SCENE_SCREENSHOT_DIR: test-results/scene-${{ matrix.browser }}
          HEXROTA_SCENE_TRACE: '1'
      - name: Keep Tavik scene screenshots and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tavik-scene-${{ matrix.browser }}
          path: test-results/scene-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Keep Comic Adventure screenshots and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comic-ui-${{ matrix.browser }}
          path: test-results/comic-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Keep garden screenshots and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: garden-mobile-${{ matrix.browser }}
          path: test-results/garden-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Keep economy screenshots and browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: economy-mobile-${{ matrix.browser }}
          path: test-results/economy-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Keep swap screenshots and pixel report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swap-visual-${{ matrix.browser }}
          path: test-results/swap-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7

  observable-difficulty-audit:
    name: Observable difficulty audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Check hidden-information independence and reproduce all audit trials
        run: npm run test:observable

  csharp-catalog-parity:
    name: C# catalog and attempt parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare catalogs, selections and replay saves
        run: npm run test:unity-catalog

  csharp-hint-adapter-parity:
    name: C# hints and reward adapter parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare hints with node and injected clock budgets
        run: npm run test:unity-hints
      - name: Compile C# 7.3 and compare reward inputs and restored director state
        run: npm run test:unity-reward-adapter

  csharp-life-parity:
    name: C# life parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare life transitions, migrations and errors
        run: npm run test:unity-lives

  csharp-session-parity:
    name: C# application, save and event parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install test dependencies
        run: npm ci
      - name: Compile C# 7.3 and compare real app sessions, atomic saves and local events
        run: npm run test:unity-session

  csharp-economy-parity:
    name: C# progression and economy parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare permanent progression and wallet ledgers
        run: npm run test:unity-economy

  csharp-command-parity:
    name: C# assisted gameplay command parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare every assisted command and intermediate wave
        run: npm run test:unity-commands

  csharp-rescue-parity:
    name: C# second-chance and receipt parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare rescue claims, receipts, quotas and clock recovery
        run: npm run test:unity-rescue

  balance-lab-economy-isolation:
    name: Balance Lab economy isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out integrated game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install actual Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Check out unmerged Lab only as a pinned isolated test fixture
        uses: actions/checkout@v4
        with:
          ref: 85bc092d4d2e0dc01e91527b92a1d8cbf4664ca1
          path: .lab-compat-fixture
          persist-credentials: false
      - name: Verify Lab cannot read or change the integrated economy in Chromium
        run: npm run test:balance-lab-economy
        env:
          HEXROTA_LAB_SOURCE: ${{ github.workspace }}/.lab-compat-fixture
          HEXROTA_BROWSER: chromium
          HEXROTA_LAB_ECONOMY_REPORT_DIR: test-results/lab-economy-chromium
      - name: Verify Lab cannot read or change the integrated economy in WebKit
        run: npm run test:balance-lab-economy
        env:
          HEXROTA_LAB_SOURCE: ${{ github.workspace }}/.lab-compat-fixture
          HEXROTA_BROWSER: webkit
          HEXROTA_LAB_ECONOMY_REPORT_DIR: test-results/lab-economy-webkit
      - name: Keep isolated Lab screenshots and privacy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: balance-lab-economy-isolation
          path: test-results/lab-economy-*
          if-no-files-found: warn
          retention-days: 7

  application-state-browser:
    name: Application state in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install actual browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify state transitions, native modals, canonical recovery and offline resume
        run: npm run test:state-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_STATE_SCREENSHOT_DIR: test-results/state-${{ matrix.browser }}
      - name: Verify F-01 commits once and presentation cannot roll back durable commands
        run: npm run test:f01-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_F01_SCREENSHOT_DIR: test-results/f01-browser-${{ matrix.browser }}
      - name: Keep application state transition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-state-${{ matrix.browser }}
          path: test-results/state-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Verify every resolved animation wave and interruption boundary
        run: npm run test:animation-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
          HEXROTA_PIPELINE_SCREENSHOT_DIR: test-results/animation-pipeline-${{ matrix.browser }}
      - name: Keep animation phase, identity and mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animation-pipeline-${{ matrix.browser }}
          path: test-results/animation-pipeline-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
      - name: Keep F-01 native input, write-count and rendering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f01-presentation-${{ matrix.browser }}
          path: test-results/f01-browser-${{ matrix.browser }}
          if-no-files-found: warn
          retention-days: 7
