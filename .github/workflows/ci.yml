name: Hexrota CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Tests only need to read repository contents.
permissions:
  contents: read

concurrency:
  group: hexrota-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay-tests:
    name: Gameplay, UI and data tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test gameplay, variants, lives, UI and data consistency
        run: npm test

  csharp-reward-parity:
    name: C# reward parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare JavaScript reward outputs
        run: npm run test:unity-rewards

  csharp-gameplay-parity:
    name: C# gameplay parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile C# 7.3 and compare every gameplay wave and save
        run: npm run test:unity-gameplay

  browser-session-consistency:
    name: Chromium life and save consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real two-tab locks, atomic save recovery and verified ad rewards
        run: npm run test:session-browser

  mobile-input-browser:
    name: Mobile input in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test actual SVG geometry and pointer input
        run: npm run test:mobile-browser
        env:
          HEXROTA_BROWSER: ${{ matrix.browser }}
