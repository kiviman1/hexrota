name: Prepare approved Tavik art
on:
  push:
    branches: [feat/comic-adventure-ui-9-6]
    paths: ['.tavik-transfer/apply.py', '.github/workflows/tavik-transfer.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: python .tavik-transfer/apply.py
      - run: npm ci
      - run: npm run test:comic-ui && npm run test:maintenance
      - name: Publish only the approved review branch
        env:
          BRANCH: feat/comic-adventure-ui-9-6
        run: |
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git rm -r .tavik-transfer
          git rm .github/workflows/tavik-transfer.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ui): integrate user-approved Tavik without changing gameplay'
          git push origin "HEAD:refs/heads/$BRANCH"
