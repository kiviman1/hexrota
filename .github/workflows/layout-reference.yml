name: Prepare reviewed layout corrections
on:
  push:
    branches: [feat/comic-adventure-ui-9-6]
    paths: ['.layout-review/apply.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: python .layout-review/apply.py
      - run: npm ci
      - run: npm run test:maintenance && npm run test:comic-ui
      - name: Publish only reviewed UI branch
        env:
          BRANCH: feat/comic-adventure-ui-9-6
        run: |
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$GITHUB_SHA"
          git rm -r .layout-review
          git add src/styles/06-comic-adventure.css dist/style.css check-comic-ui-browser.cjs dist/index.html dist/app.js dist/hint-worker.js dist/sw.js dist/ui-kit.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): anchor dialogs and correct responsive alignment with layout regressions'
          git push origin "HEAD:refs/heads/$BRANCH"
