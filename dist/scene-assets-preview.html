<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hexrota · Tavik Sahne Provası</title><link rel="stylesheet" href="assets/scenes/coop-v1/tavik-motion.css"><style>
*{box-sizing:border-box}body{margin:0;background:#271e3d;color:#fff6da;font:16px system-ui,sans-serif}button,select{font:inherit;cursor:pointer;color:#4b2d58;border:2px solid #dcb462;background:#fff2ce;border-radius:12px;padding:9px 13px}button:focus-visible,select:focus-visible{outline:3px solid cyan;outline-offset:2px}.scene{position:relative;isolation:isolate;min-height:570px;height:calc(100svh - 105px);overflow:hidden;background:#91c653}.backdrop{position:absolute;inset:0;background:center/cover no-repeat url('assets/scenes/coop-v1/backgrounds/clearing.webp');z-index:-3}.shade{position:absolute;inset:0;background:linear-gradient(#24172a55,transparent 25%,transparent 65%,#24172a66);z-index:-2}.fade{position:absolute;inset:0;background:#24172a;opacity:0;pointer-events:none;transition:opacity .22s;z-index:8}.scene.changing .fade{opacity:1}.hud{position:absolute;top:max(15px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);border:3px solid #fbd483;border-radius:18px;background:linear-gradient(#775293,#3a2859);padding:10px 24px;text-align:center;box-shadow:0 5px #2b173caa;max-width:94%;z-index:5}.hud strong{display:block}.hud small{font-size:11px;color:#eaddd9}.actor-host{position:absolute;left:6%;bottom:5%;--tavik-size:clamp(130px,23vw,270px);z-index:3}.speech{position:absolute;left:5%;bottom:43%;width:min(280px,28%);border:3px solid #b7793f;border-radius:20px;background:#fff2ce;color:#503147;padding:15px;box-shadow:0 4px #42244444;font-weight:700;z-index:4}.board{position:absolute;inset:18% 28% 17%;display:grid;align-content:center;justify-content:center;gap:3px;grid-template-columns:repeat(5,minmax(0,66px));padding:20px;background:#33234dd9;border:3px solid #e8c975;border-radius:28px;box-shadow:0 8px 0 #21173066;z-index:2}.board[hidden]{display:none}.hex{display:grid;place-items:center;height:65px;aspect-ratio:1.1;background:linear-gradient(#e7cef8,#ba8ae4);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);font-size:30px;font-weight:850;color:#432a65}.hex:nth-child(3n){background:linear-gradient(#ffeaa4,#e9bc54);color:#695028}.hex:nth-child(4n){background:linear-gradient(#bbe8f7,#80bddb);color:#244f68}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:12px;min-height:90px}.controls small{flex:1 1 100%;text-align:center;color:#d6c6de;font-size:12px}.scene-label{position:absolute;right:18px;bottom:18px;background:#35234dcc;padding:8px 14px;border-radius:14px;color:#fff3ce;font-size:13px;z-index:4}.play{background:linear-gradient(#b4e95e,#54a22c);color:#fff;border-color:#d8f59b;font-weight:800}

'use strict';const base='assets/scenes/coop-v1/',scene=document.querySelector('.scene'),back=document.querySelector('.backdrop'),stage=document.querySelector('#stage'),pose=document.querySelector('#pose'),board=document.querySelector('.board'),speech=document.querySelector('.speech');const names={idle:'Bekleme',point:'Yön gösterme',inspect:'İnceleme',worried:'Şaşırma',celebrate:'Kutlama',hop:'Zıplama',carry:'Tahta taşıma',build:'İnşa',proud:'Gurur',think:'Düşünme',call:'Seslenme',rest:'Dinlenme'};const keys=['clearing','frame','roof','finished'];for(const [id,label]of Object.entries(names)){const o=document.createElement('option');o.value=id;o.textContent=label;pose.append(o);}let marks='';let k=0;for(let q=-2;q<=2;q++){for(let r=-2;r<=2;r++){if(Math.abs(q+r)>2)continue;const x=160+q*46.5,y=140+(r+q/2)*53.7;let points=[];for(let z=0;z<6;z++){const t=z*Math.PI/3;points.push((x+29*Math.cos(t))+','+(y+29*Math.sin(t)));}const colors=['#c3a4ee','#f7d37b','#eda99b','#9ad1e6'];marks+='<polygon points="'+points.join(' ')+'" fill="'+colors[k%4]+'" stroke="#ffffffaa" stroke-width="2"/><text x="'+x+'" y="'+(y+10)+'" text-anchor="middle" font-size="28" font-weight="800" fill="#432e55">'+(1+k++%4)+'</text>';}}board.innerHTML='<svg aria-hidden="true" style="width:100%;height:100%;min-height:0" viewBox="0 0 320 280">'+marks+'</svg>';const actor=HexTavikMotion.mount(document.querySelector('.actor-host'),{resolvePose:id=>window.SCENE_EMBED?.poses?.[id]||base+'tavik/'+id+'.webp'});let transition=0;async function setStage(value){if(!keys.includes(value))return;const own=++transition;const im=new Image();im.src=window.SCENE_EMBED?.backgrounds?.[value]||base+'backgrounds/'+value+'.webp';try{await im.decode();}catch{return;}if(own!==transition)return;scene.classList.add('changing');await new Promise(r=>setTimeout(r,220));if(own!==transition)return;back.style.backgroundImage='url("'+im.src+'")';stage.value=value;document.querySelector('.scene-label').textContent=(keys.indexOf(value)+1)+' / 4 · '+stage.selectedOptions[0].textContent;scene.classList.remove('changing');}stage.onchange=()=>setStage(stage.value);pose.onchange=()=>actor.play(pose.value);document.querySelector('#board-toggle').onclick=()=>{board.hidden=!board.hidden;document.querySelector('#board-toggle').textContent=board.hidden?'Tahtayı göster':'Tahtayı gizle';actor.play(board.hidden?'idle':'point');speech.textContent=board.hidden?'“Şuraya bir kümes! Çatısı da olacak… umarım.”':'“Komşu taşları değiştir. Aynı sayıları sıraya getir!”';};document.querySelector('#reduce').onchange=e=>actor.setReducedMotion(e.target.checked);document.querySelector('#build').onclick=async function(){this.disabled=true;try{await actor.play('build');await new Promise(r=>setTimeout(r,2100));await setStage(keys[Math.min(3,keys.indexOf(stage.value)+1)]);await actor.play('celebrate');speech.textContent='“Sağlam oldu! Galiba. Bir de çatısını deneyelim.”';}finally{this.disabled=false;}};window.sceneDemo={actor,setStage};window.addEventListener('pagehide',()=>actor.destroy());
